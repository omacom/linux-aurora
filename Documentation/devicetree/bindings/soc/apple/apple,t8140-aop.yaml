%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8140-aop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 Always-On Processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The Always-On Processor provides audio and sensor services through firmware
  loaded by the bootloader. On T8140 the application processor uses a primary
  mailbox and a separate setup-port mailbox; on T8152 the setup port belongs to
  the secure world and only the primary mailbox exists. Each mailbox consumer
  has its own DMA allocation window in the inherited AOP DART mappings.

properties:
  compatible:
    enum:
      - apple,t8140-aop
      - apple,t8152-aop

  reg:
    items:
      - description: AOP register and boot-argument window
      - description: ASC wrapper and processor control registers

  reg-names:
    items:
      - const: mmio
      - const: asc

  mboxes:
    minItems: 1
    items:
      - description: Primary firmware transport
      - description: Firmware setup-port transport (T8140 only)

  mbox-names:
    minItems: 1
    items:
      - const: mbox
      - const: setup

  iommus:
    maxItems: 1

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description:
      Host DMA allocation window as a base and nonzero size. The window must
      occupy root slots available to the host on this AOP DART stream.

  power-domains:
    maxItems: 1

  als:
    type: object
    $ref: /schemas/iio/light/apple,t8140-aop-als.yaml#

  audio:
    type: object
    $ref: /schemas/sound/apple,t8140-aop-audio.yaml#

allOf:
  - if:
      properties:
        compatible:
          const: apple,t8140-aop
    then:
      properties:
        mboxes:
          minItems: 2
        mbox-names:
          minItems: 2
    else:
      properties:
        mboxes:
          maxItems: 1
        mbox-names:
          maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - mbox-names
  - iommus
  - apple,dma-range
  - power-domains

additionalProperties: false
