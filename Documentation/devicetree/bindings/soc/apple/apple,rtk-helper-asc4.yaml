%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,rtk-helper-asc4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple ASC4 RTKit helper coprocessor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Apple SoCs contain a number of ASC coprocessors that run RTKit firmware.
  For some of them the operating system only has to boot the coprocessor and
  keep it running, while the devices it serves are described by other nodes.
  The MTP (multi-touch processor) ASC of Apple laptops is one of these. It
  serves the built-in keyboard and trackpad over DockChannel, and the
  DockChannel HID transport refers to this node through its apple,helper-cpu
  property.

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-mtp
          - apple,t6030-mtp
          - apple,t6031-mtp
          - apple,t6050-mtp
          - apple,t8112-mtp
          - apple,t8122-mtp
          - apple,t8140-mtp
          - apple,t8142-mtp
      - enum:
          - apple,t6020-rtk-helper-asc4
          - apple,t6030-rtk-helper-asc4
          - apple,t8112-rtk-helper-asc4
          - apple,t8122-rtk-helper-asc4
          - apple,t8140-rtk-helper-asc4
          - apple,t8142-rtk-helper-asc4
      - const: apple,mtp
      - const: apple,rtk-helper-asc4

  reg:
    minItems: 1
    items:
      - description: ASC control registers
      - description:
          Coprocessor SRAM, from which the firmware may ask the host to map
          buffers instead of allocating them from system memory

  reg-names:
    minItems: 1
    items:
      - const: asc
      - const: sram

  mboxes:
    maxItems: 1

  iommus:
    maxItems: 1

  '#helper-cells':
    const: 0
    description:
      Present in existing device trees. Nothing references the helper with
      argument cells; the DockChannel HID transport uses a plain phandle.

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - iommus

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        mtp@314600000 {
            compatible = "apple,t8140-mtp", "apple,t8140-rtk-helper-asc4",
                         "apple,mtp", "apple,rtk-helper-asc4";
            reg = <0x3 0x14600000 0x0 0x4000>,
                  <0x3 0x14050000 0x0 0x4000>;
            reg-names = "asc", "sram";
            mboxes = <&mtp_mbox>;
            iommus = <&mtp_dart 0>;
        };
    };
