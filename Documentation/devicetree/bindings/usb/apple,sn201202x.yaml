%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,sn201202x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments sn201202x Type-C Power Delivery controller

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: |
  Texas Instruments sn201202x Type-C Power Delivery controller

  A variant of tps6598x controller also known as Apple ACE3
  present on hardware with Apple SoCs starting from the M3.

  The controller can be polled when interrupt resources are not supplied.

  T8132 omits the register-selection interrupt, so selection is polled while
  event, standby and wakeup notifications use interrupts.

properties:
  compatible:
    oneOf:
      - const: apple,sn201202x
      - items:
          - const: apple,t8132-sn201202x
          - const: apple,sn201202x

  reg:
    maxItems: 1

  interrupts:
    minItems: 3
    maxItems: 4

  interrupt-names:
    minItems: 3
    maxItems: 4

  wakeup-source: true

  apple,sleep-ssps:
    type: boolean
    description:
      Tell the controller the system's power state (SSPS) around a
      firmware-driven suspend, S3 before it and S0 after.

  apple,cable-change-ssps:
    type: boolean
    description:
      At a cable change while running, send the controller the system power
      state sequence macOS sends it (traced on the J714s). At a detach, write
      register 0x50, then SSPS 0x02. At an attach, SSPS 0x00, then USBw 0x00
      after the attach's debounce.

  apple,sleep-ssps-rules:
    type: boolean
    description:
      Talk to the controller under the sleep's rules. For its system power
      state command, wake it on its bus first and read the command's end at
      intervals rather than back to back. For every command, count one found
      done on a read made past its limit as done. A controller that does not
      take S3 refuses the sleep. The controllers that need these rules are
      polled on their bus and miss or delay a command's end when read back to
      back.

  apple,reset-on-failed-probe:
    type: boolean
    description:
      The previous boot can leave the controller in the middle of a command,
      so its first probe can fail on the reads that follow. Probe it again a
      few times after waits, with a cold reset before a late try, before
      deferring the probe.

  apple,debug-lock-key:
    $ref: /schemas/types.yaml#/definitions/string
    pattern: "^.{4}$"
    description:
      The four-character key (the board number, reversed, such as "417J" on
      the J714s) that the controller's LOCK command takes to unlock the
      commands that need it. These are its debug mode, for rearming the
      debug link after a sleep ended it, and a disconnect and reattach of
      its partner (DISC).

  apple,event-irq-in-sleep:
    type: boolean
    description:
      The controller's event interrupt stays live while the controller
      sleeps, so it can sleep while its port is idle and still report a
      port event. A register access wakes it first.

  apple,usb-remote-wake:
    type: boolean
    description:
      This controller serves the USB controller's root port, and watches its
      USB2 lines for a remote wakeup during a firmware-driven system sleep.

  connector:
    $ref: /schemas/connector/usb-connector.yaml#

  apple,no-liquid-detection:
    type: boolean
    description:
      The controller's port has no liquid detection and corrosion mitigation
      (LDCM), as on the MagSafe 3 port, which the ADT lists with the
      "Power In" feature only.

  apple,reset-inherited-usb2-connection:
    type: boolean
    description: |
      A connection that is up when the OS starts keeps state from the boot
      chain that resetting the host PHY does not recover: a USB2 repeater
      connection on the boot port (J716c), or a Type-C retimer set up before
      the host PHY ran, which keeps SuperSpeed from training (J575c).
      Renegotiate a normal application connection before starting the host
      controllers. Debug routes are preserved.

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8132-sn201202x
    then:
      properties:
        interrupts:
          items:
            - description: Primary irq used for tps6598x events
            - description: Standby command completed
            - description: Wakeup command completed
        interrupt-names:
          items:
            - const: irq
            - const: sleep
            - const: wake
    else:
      properties:
        interrupts:
          items:
            - description: Primary irq used for tps6598x events
            - description: Logical register selection completed
            - description: Standby command completed
            - description: Wakeup command completed
        interrupt-names:
          items:
            - const: irq
            - const: select
            - const: sleep
            - const: wake

dependentRequired:
  interrupts: [interrupt-names]
  interrupt-names: [interrupts]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>
    spmi {
        #address-cells = <2>;
        #size-cells = <0>;
        usb-pd@c {
            compatible = "apple,sn201202x";
            reg = <0xc SPMI_USID>;
            interrupts = <11 IRQ_TYPE_EDGE_RISING>,
                         <13 IRQ_TYPE_EDGE_RISING>,
                         <17 IRQ_TYPE_EDGE_RISING>,
                         <19 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "irq", "select", "sleep", "wake";

            connector {
                compatible = "usb-c-connector";
                label = "USB-C";

                port {
                    typec_ep: endpoint {
                        remote-endpoint = <&otg_ep>;
                    };
                };
            };
        };
    };
