%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/apple,pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple PCIe host controller

maintainers:
  - Mark Kettenis <kettenis@openbsd.org>

description: |
  The Apple PCIe host controller is a PCIe host controller with
  multiple root ports present in Apple ARM SoC platforms, including
  various iPhone and iPad devices and the "Apple Silicon" Macs.
  The controller incorporates Synopsys DesigWare PCIe logic to
  implements its root ports.  But the ATU found on most DesignWare
  PCIe host bridges is absent.

  On systems derived from T602x, the PHY registers are in a region
  separate from the port registers. In that case, there is one PHY
  register range per port register range.

  The PCIe-C variant connects a single root port to a USB4 router instead of
  a physical PCIe link. It has no external PHY or PERST# GPIO and follows the
  router's cable-controlled power lifetime.

  All root ports share a single ECAM space, but separate GPIOs are
  used to take the PCI devices on those ports out of reset.  Therefore
  the standard "reset-gpios" and "max-link-speed" properties appear on
  the child nodes that represent the PCI bridges that correspond to
  the individual root ports.

  MSIs are handled by the PCIe controller and translated into regular
  interrupts.  A range of 32 MSIs is provided.  These 32 MSIs can be
  distributed over the root ports as the OS sees fit by programming
  the PCIe controller's port registers.

$defs:
  tunable:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    items:
      items:
        - description: Register offset
        - description: Mask of bits to clear
        - description: Bits to set
    description: Register initialization tuples for one controller region.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t8103-pcie
              - apple,t8112-pcie
              - apple,t6000-pcie
          - const: apple,pcie
      - items:
          - const: apple,t8122-pcie
          - const: apple,t6020-pcie
      - const: apple,t6020-pcie
      - const: apple,t8140-pcie
      - const: apple,t8103-pciec
      - items:
          - const: apple,t8112-pciec
          - const: apple,t8103-pciec
      - items:
          - const: apple,t8152-pciec
          - const: apple,t8103-pciec
      - const: apple,t6000-pciec

  reg:
    minItems: 3
    maxItems: 10

  reg-names:
    minItems: 3
    maxItems: 10

  ranges:
    minItems: 2
    maxItems: 3

  interrupts:
    description:
      Interrupt specifiers, one for each root port.
    minItems: 1
    maxItems: 4

  msi-parent: true

  msi-ranges:
    maxItems: 1

  iommu-map: true
  iommu-map-mask: true

  power-domains:
    maxItems: 1

  resets:
    description:
      Reset of a tunneled (PCIe-C) controller and its DART, for controllers
      the kernel initializes itself.
    maxItems: 1

  dma-coherent: true

  apple,pciec-kernel-init:
    type: boolean
    description: The kernel initializes the tunneled controller from reset.

  apple,pciec-preinit-status:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Handoff status of a tunneled (PCIe-C) controller. 1 means the boot
      loader left the port initialized; the driver then replays the
      initialization only if the port is not running.

  apple,tunable-rc:
    $ref: '#/$defs/tunable'
    description: Root-complex register initialization tuples.

  apple,tunable-fabric:
    $ref: '#/$defs/tunable'
    description: Initialization tuples for the fabric register region.

  apple,tunable-debug:
    $ref: '#/$defs/tunable'
    description: Initialization tuples for the debug register region.

  apple,tunable-oe-fabric:
    $ref: '#/$defs/tunable'
    description: Initialization tuples for the oe-fabric register region.

  apple,piodma:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      T8140 PIODMA bootstrap engine used before native downstream ECAM access.

patternProperties:
  "^pci@":
    $ref: /schemas/pci/pci-bus.yaml#
    type: object
    description: A single PCI root port

    properties:
      reg:
        maxItems: 1

      pwren-gpios:
        description: Optional GPIO to power on the device
        maxItems: 1

      interrupt-controller: true

      apple,tunable:
        $ref: '#/$defs/tunable'
        description: Initialization tuples relative to this port's registers.

    required:
      - interrupt-controller
      - "#interrupt-cells"
      - interrupt-map-mask
      - interrupt-map

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - reg-names
  - bus-range
  - interrupts
  - msi-controller
  - msi-parent
  - msi-ranges

unevaluatedProperties: false

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/interrupt-controller/msi-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-pcie
    then:
      properties:
        apple,piodma: true
    else:
      properties:
        apple,piodma: false
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8103-pcie
    then:
      properties:
        reg:
          maxItems: 5
        interrupts:
          maxItems: 3
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6020-pcie
    then:
      properties:
        reg-names:
          minItems: 10
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8103-pciec
              - apple,t6000-pciec
    then:
      properties:
        reg:
          minItems: 5
          maxItems: 7
        reg-names:
          oneOf:
            - items:
                - const: config
                - const: rc
                - const: port0
                - const: fabric
                - const: debug
            - items:
                - const: config
                - const: rc
                - const: port0
                - const: fabric
                - const: debug
                - const: ltssm
                - enum: [intr2axi, oe-fabric]
        interrupts:
          maxItems: 1
        ranges:
          minItems: 3
          maxItems: 3
    else:
      properties:
        resets: false
        apple,pciec-kernel-init: false
        apple,tunable-rc: false
        apple,tunable-fabric: false
        apple,tunable-debug: false
        apple,tunable-oe-fabric: false
        ranges:
          maxItems: 2
      allOf:
        - if:
            properties:
              compatible:
                contains:
                  const: apple,t8140-pcie
          then:
            properties:
              reg:
                minItems: 8
                maxItems: 8
              reg-names:
                items:
                  - const: config
                  - const: rc
                  - const: port0
                  - const: port1
                  - const: port2
                  - const: phy0
                  - const: phy1
                  - const: phy2
              interrupts:
                maxItems: 3
          else:
            properties:
              reg-names:
                minItems: 3
                items:
                  - const: config
                  - const: rc
                  - const: port0
                  - const: port1
                  - const: port2
                  - const: port3
                  - const: phy0
                  - const: phy1
                  - const: phy2
                  - const: phy3
      patternProperties:
        "^pci@":
          properties:
            apple,tunable: false
          required:
            - reset-gpios

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      pcie0: pcie@690000000 {
        compatible = "apple,t8103-pcie", "apple,pcie";
        device_type = "pci";

        reg = <0x6 0x90000000 0x0 0x1000000>,
              <0x6 0x80000000 0x0 0x100000>,
              <0x6 0x81000000 0x0 0x4000>,
              <0x6 0x82000000 0x0 0x4000>,
              <0x6 0x83000000 0x0 0x4000>;
        reg-names = "config", "rc", "port0", "port1", "port2";

        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 695 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 698 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 701 IRQ_TYPE_LEVEL_HIGH>;

        msi-controller;
        msi-parent = <&pcie0>;
        msi-ranges = <&aic AIC_IRQ 704 IRQ_TYPE_EDGE_RISING 32>;

        iommu-map = <0x100 &dart0 1 1>,
                    <0x200 &dart1 1 1>,
                    <0x300 &dart2 1 1>;
        iommu-map-mask = <0xff00>;

        bus-range = <0 3>;
        #address-cells = <3>;
        #size-cells = <2>;
        ranges = <0x43000000 0x6 0xa0000000 0x6 0xa0000000 0x0 0x20000000>,
                 <0x02000000 0x0 0xc0000000 0x6 0xc0000000 0x0 0x40000000>;

        power-domains = <&ps_apcie_gp>;
        pinctrl-0 = <&pcie_pins>;
        pinctrl-names = "default";

        port00: pci@0,0 {
          device_type = "pci";
          reg = <0x0 0x0 0x0 0x0 0x0>;
          reset-gpios = <&pinctrl_ap 152 0>;

          #address-cells = <3>;
          #size-cells = <2>;
          ranges;

          interrupt-controller;
          #interrupt-cells = <1>;
          interrupt-map-mask = <0 0 0 7>;
          interrupt-map = <0 0 0 1 &port00 0 0 0 0>,
                          <0 0 0 2 &port00 0 0 0 1>,
                          <0 0 0 3 &port00 0 0 0 2>,
                          <0 0 0 4 &port00 0 0 0 3>;
        };

        port01: pci@1,0 {
          device_type = "pci";
          reg = <0x800 0x0 0x0 0x0 0x0>;
          reset-gpios = <&pinctrl_ap 153 0>;

          #address-cells = <3>;
          #size-cells = <2>;
          ranges;

          interrupt-controller;
          #interrupt-cells = <1>;
          interrupt-map-mask = <0 0 0 7>;
          interrupt-map = <0 0 0 1 &port01 0 0 0 0>,
                          <0 0 0 2 &port01 0 0 0 1>,
                          <0 0 0 3 &port01 0 0 0 2>,
                          <0 0 0 4 &port01 0 0 0 3>;
        };

        port02: pci@2,0 {
          device_type = "pci";
          reg = <0x1000 0x0 0x0 0x0 0x0>;
          reset-gpios = <&pinctrl_ap 33 0>;

          #address-cells = <3>;
          #size-cells = <2>;
          ranges;

          interrupt-controller;
          #interrupt-cells = <1>;
          interrupt-map-mask = <0 0 0 7>;
          interrupt-map = <0 0 0 1 &port02 0 0 0 0>,
                          <0 0 0 2 &port02 0 0 0 1>,
                          <0 0 0 3 &port02 0 0 0 2>,
                          <0 0 0 4 &port02 0 0 0 3>;
        };
      };
    };
