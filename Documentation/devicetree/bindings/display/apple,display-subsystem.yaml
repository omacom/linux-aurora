%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,display-subsystem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display subsystem

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Component master for one or more Apple display coprocessors. Each IOMMU
  entry describes a scanout DART stream owned by a DCP instance.

properties:
  compatible:
    enum:
      - apple,display-subsystem
      - apple,t6034-display-subsystem

  iommus:
    minItems: 1
    maxItems: 8

required:
  - compatible
  - iommus

unevaluatedProperties: false
...
