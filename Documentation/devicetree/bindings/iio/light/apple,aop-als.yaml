%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/apple,aop-als.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AOP ambient light sensor service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The service is supplied by the parent Always-On Processor. Firmware and
  calibration handoff determine its availability. It has no independent
  application-processor register window or interrupt.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-aop-als
          - apple,t6030-aop-als
          - apple,t6050-aop-als
          - apple,t8112-aop-als
          - apple,t8142-aop-als
  required:
    - compatible

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6020-aop-als
              - apple,t6050-aop-als
              - apple,t8112-aop-als
              - apple,t8142-aop-als
          - const: apple,aop-als
      - items:
          - const: apple,t6030-aop-als
          - const: apple,t6020-aop-als
          - const: apple,aop-als

  firmware-name:
    maxItems: 1
    description: Calibration file the driver sends the sensor over the AOP setup port.

required:
  - compatible

additionalProperties: false
