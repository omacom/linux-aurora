%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,t8140-pmp-report.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 and T8140 PMP report aperture

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The PMP report aperture contains a read window and an update window.
  The PMP running bit qualifies the per-cluster fast-die effort. Lane 1
  tracks P-cluster load in Linux measurements. Lane 0 is assigned to the
  E cluster from the Apple device tree order and has not been observed
  changing. Only documented report entries may be read; the aperture is
  not a contiguous readable array of registers.

properties:
  compatible:
    enum:
      - apple,t8132-pmp-v2-report
      - apple,t8140-pmp-v2-report

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  apple,pmp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The PMP that publishes this report, on SoCs where the host starts the
      PMP after a display handoff.

patternProperties:
  '^report@[0-9a-f]+$':
    type: object
    description: |
      A device whose power state the host reports to the PMP, provided as a
      power domain. The host sets the device's request bit after its parent
      domain powers on and clears it before the parent powers off, and waits
      for the PMP to acknowledge while the PMP runs.
    additionalProperties: false

    properties:
      compatible:
        const: apple,t8140-pmp-v2-report-entry

      reg:
        maxItems: 1
        description: PMP soc-device index of the device.

      label:
        description: Name of the power domain.

      '#power-domain-cells':
        const: 0

      power-domains:
        maxItems: 1

      apple,always-on:
        type: boolean
        description: Report the device as on from probe.

      apple,no-ack:
        type: boolean
        description:
          The PMP does not acknowledge this entry's requests; the host sets
          and clears the request bit without waiting for an acknowledgement.

      apple,soc-device-record:
        type: boolean
        description:
          The request and acknowledge bits are indexed by the index of the
          PMP soc-device record (apple,tunable-soc-device on the PMP) that
          holds this entry's device ID, instead of by reg. Only valid on a
          report whose PMP the host starts.

    required:
      - compatible
      - reg
      - label
      - '#power-domain-cells'

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pmp-report@3003c0000 {
            compatible = "apple,t8140-pmp-v2-report";
            reg = <3 0x003c0000 0 0x14000>;
            #address-cells = <1>;
            #size-cells = <0>;

            report@9 {
                compatible = "apple,t8140-pmp-v2-report-entry";
                reg = <0x9>;
                label = "pmp-gfx";
                #power-domain-cells = <0>;
            };
        };
    };
