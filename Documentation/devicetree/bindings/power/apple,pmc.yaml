%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,pmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC PMC voter interface

maintainers:
  - Diljit Singh <hey@djdev.me>

description: |
  The PMC arbitrates the performance states of shared rails, such as the
  DRAM controller and the SoC fabric, between voter agents. Each agent has a
  perf-state floor word with one 4-bit state per rail, and each rail has an
  interface enable word with one bit per agent. The PMC only honours an
  agent's floor on rails where its interface is enabled.

  Static agents are enabled for as long as the PMC is bound. A dynamic
  agent is a power domain: it is enabled after its parent domain powers on
  and disabled before its parent domain powers off. The host performance
  controller's agent is described by a child node that raises its floor
  while the CPU clusters or the GPU are busy.

properties:
  compatible:
    enum:
      - apple,t8132-pmc
      - apple,t8140-pmc

  reg:
    items:
      - description: Perf-state floor words of the voter agents
      - description: |
          Per-agent words holding the floor the PMC honours for each agent,
          and per-rail interface enable words

  reg-names:
    items:
      - const: voters
      - const: rails

  power-domains:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  apple,static-voters:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Voter agents to enable on every rail.
    minItems: 1
    maxItems: 32
    items:
      maximum: 31

  '#cooling-cells':
    const: 2
    description: |
      The PMC can limit the DRAM controller (DCS) rail. Cooling state 0 leaves
      the rail to the agents' votes; each further state lowers the highest
      DCS state the PMC honours for them by one, down to the lowest state.

  apple,dcs-power-microwatt:
    description: |
      Power the system draws at each DCS performance state above what it
      draws at the lowest one, from the lowest state up, measured under a
      load whose speed follows the DCS state. With it, the DCS limit is a
      power actor that the power allocator thermal governor can drive.
    minItems: 2
    maxItems: 16

patternProperties:
  '^voter@[0-9a-f]+$':
    type: object
    description: A dynamic voter agent, provided as a power domain.
    additionalProperties: false

    properties:
      reg:
        maxItems: 1
        description: Voter agent index.

      label:
        description: Name of the power domain.

      '#power-domain-cells':
        const: 0

      power-domains:
        maxItems: 1
        description: Domain that must be powered while the agent is enabled.

    required:
      - reg
      - '#power-domain-cells'

  '^performance-controller@[0-9a-f]+$':
    type: object
    description: The host performance controller's voter agent.
    additionalProperties: false

    properties:
      compatible:
        enum:
          - apple,t8132-clpc
          - apple,t8140-clpc

      reg:
        maxItems: 1
        description: Voter agent index.

      apple,gpu-power-state:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: PMGR power state of the GPU, used as a demand input.

    required:
      - compatible
      - reg

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        power-management@302800000 {
            compatible = "apple,t8140-pmc";
            reg = <0x3 0x02800000 0x0 0x10000>,
                  <0x3 0x028aa000 0x0 0x3000>;
            reg-names = "voters", "rails";
            #address-cells = <1>;
            #size-cells = <0>;
            #cooling-cells = <2>;
            apple,static-voters = <0 1 3>;
            apple,dcs-power-microwatt = <0 919000 1453000 2058000 2407000>;

            performance-controller@1 {
                compatible = "apple,t8140-clpc";
                reg = <1>;
            };

            voter@2 {
                reg = <2>;
                label = "gfx";
                #power-domain-cells = <0>;
            };
        };
    };
