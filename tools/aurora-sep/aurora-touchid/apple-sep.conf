# Installed by aurora-touchid: the owner opted in to shared xART writes and
# first-boot identity provisioning when installing Touch ID support. A
# read-only install hides this file with /etc/modprobe.d/apple-sep.conf
# containing "options apple_sep xart_writes=0 provision_keybag=0" (the
# enclave still boots; Touch ID stays off). The override has to use this
# name. A different name is passed as well, and the set-once parameters
# then refuse to load.
options apple_sep xart_writes=1 provision_keybag=1
