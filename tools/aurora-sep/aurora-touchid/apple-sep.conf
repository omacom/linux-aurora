# Installed by aurora-touchid: the owner opted in to shared xART writes and
# first-boot identity provisioning when installing Touch ID support. Override
# with "options apple_sep xart_writes=0 provision_keybag=0" in /etc/modprobe.d
# for read-only operation (the enclave still boots; Touch ID stays off).
options apple_sep xart_writes=1 provision_keybag=1
