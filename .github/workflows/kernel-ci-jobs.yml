# The kernel CI jobs, shared by kernel-ci.yml and kernel-ci-label.yml.
# tools/aurora-ci/README.rst describes each job and how to run it locally.
#
# Runners: everything runs on GitHub-hosted runners, which cost nothing for a
# public repository. The two CPU-heavy jobs (package, kunit) run on the
# repository variable KERNEL_CI_RUNNER when it is set, as a JSON runs-on value
# such as ["namespace-profile-arm64-linux-apple-12x32"]; it defaults to
# GitHub's arm64 runner.

name: Kernel CI jobs

on:
  workflow_call:
    outputs:
      key:
        description: Build key (kernel tree plus packaging inputs)
        value: ${{ jobs.plan.outputs.key }}
      package_run:
        description: Run that built the packages, when this run reused them
        value: ${{ jobs.plan.outputs.package_run }}
      tier:
        description: light or full
        value: ${{ jobs.plan.outputs.tier }}

permissions: {}

env:
  BUILD_LABEL: ci:build
  RECIPE_REPOSITORY: omacom/omarchy-pkgs
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    # Sparse checkout and fetching baseline trees can exceed ten minutes.
    timeout-minutes: 30
    permissions:
      actions: read # look up and download earlier runs' artifacts
      contents: read # check out the repository
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      reason: ${{ steps.plan.outputs.reason }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      key: ${{ steps.lookup.outputs.key }}
      kernel_tree: ${{ steps.lookup.outputs.kernel_tree }}
      recipe_commit: ${{ steps.lookup.outputs.recipe_commit }}
      package_run: ${{ steps.lookup.outputs.package_run }}
      package_artifact: ${{ steps.lookup.outputs.package_artifact }}
      verified_run: ${{ steps.lookup.outputs.verified_run }}
      pull_request_run: ${{ steps.lookup.outputs.pull_request_run }}
      base_tree: ${{ steps.lookup.outputs.base_tree }}
      baseline_run: ${{ steps.lookup.outputs.baseline_run }}
    steps:
      - name: Check out the CI tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: tools/aurora-ci
      # From the target branch's tip, never the pull request: a pull request
      # must not vouch for its own author. Not pull_request.base.sha, which
      # stays at the base the pull request was opened against. Without the
      # list (the API fails) no author is trusted.
      - name: Read the vouch list from the target branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/.github/VOUCHED.td?ref=refs/heads/$BASE_REF" \
              > "$RUNNER_TEMP/VOUCHED.td"; then
            : > "$RUNNER_TEMP/VOUCHED.td"
            echo "::warning title=Vouch list::no .github/VOUCHED.td on $BASE_REF; no author is trusted"
          fi
      - name: Plan the run
        id: plan
        run: |
          vouched=()
          [[ -f $RUNNER_TEMP/VOUCHED.td ]] && vouched=(--vouched "$RUNNER_TEMP/VOUCHED.td")
          python3 -I tools/aurora-ci/plan.py --label "$BUILD_LABEL" "${vouched[@]}"
      # Only trees are needed: the build key is made of tree hashes.
      - name: Fetch the packaging inputs
        if: steps.plan.outputs.tier == 'full'
        run: |
          git clone --quiet --depth 1 --filter=blob:none --no-checkout \
            "https://github.com/$RECIPE_REPOSITORY.git" "$RUNNER_TEMP/omarchy-pkgs"
      - name: Look up earlier builds of the same inputs
        id: lookup
        if: steps.plan.outputs.tier == 'full'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          FORCE: ${{ steps.plan.outputs.force }}
          MERGE_QUEUE_REF: ${{ github.event_name == 'merge_group' && github.ref || '' }}
        run: |
          python3 -I tools/aurora-ci/lookup-build.py --kernel . \
            --recipe-repo "$RUNNER_TEMP/omarchy-pkgs" --base-sha "$BASE_SHA" --force "$FORCE" \
            --merge-queue-ref "$MERGE_QUEUE_REF"

  commits:
    name: commits
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # checkpatch.pl runs scripts/spdxcheck.py, which needs ply.
      - name: Install checkpatch's helpers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-ply
      - name: Check sign-offs, checkpatch and UAPI changes
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          python3 -I tools/aurora-ci/check-commits.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --report "$RUNNER_TEMP/commits.json"

  compile:
    name: compile
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    env:
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fetch the event's named ref, not raw SHAs: the PR's merge ref contains
      # both parents. SHA fetches exhausted this job before compilation.
      - name: Fetch history back to the target branch
        run: |
          for depth in 64 256 1024 4096; do
            git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1 && break
            git fetch --quiet --no-tags --depth="$depth" origin "$GITHUB_REF"
          done
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
      - name: Install LLVM 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bc bison clang-18 flex lld-18 llvm-18
      # The configuration the package starts from; compile-check.py merges
      # the in-tree fragment into it the way the recipe's configure.sh does.
      - name: Fetch the shipped kernel configuration
        run: |
          git clone --quiet --depth 1 --filter=blob:none --no-checkout \
            "https://github.com/$RECIPE_REPOSITORY.git" "$RUNNER_TEMP/omarchy-pkgs"
          git -C "$RUNNER_TEMP/omarchy-pkgs" show HEAD:pkgbuilds/linux-aurora/config > "$RUNNER_TEMP/aurora.config"
          echo "omarchy-pkgs $(git -C "$RUNNER_TEMP/omarchy-pkgs" rev-parse HEAD)"
      - name: Compile what changed, at every commit, with W=1
        run: |
          python3 -I tools/aurora-ci/compile-check.py --tree . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --config "$RUNNER_TEMP/aurora.config" --fragment arch/arm64/configs/asahi.config \
            --out "$RUNNER_TEMP/compile" --per-commit --max-commits 20 --llvm=-18 --jobs "$(nproc)"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compile/report.json
            ${{ runner.temp }}/compile/summary.md
            ${{ runner.temp }}/compile/logs
          retention-days: 14
          if-no-files-found: ignore

  devicetree:
    name: device trees
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      # The pull request or queue merge commit, and the target branch tip it
      # was merged onto (its first parent).
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install dtschema and yamllint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bison flex python3-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/dt-venv"
          "$RUNNER_TEMP/dt-venv/bin/pip" install --quiet --require-hashes -r tools/aurora-ci/dt-requirements.txt
          echo "$RUNNER_TEMP/dt-venv/bin" >> "$GITHUB_PATH"
      - name: Check the device trees and bindings this change touches
        run: |
          python3 -I tools/aurora-ci/dt-check.py --tree . --base HEAD^1 --head HEAD \
            --out "$RUNNER_TEMP/dt-check" --jobs "$(nproc)"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devicetree-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dt-check/report.json
            ${{ runner.temp }}/dt-check/summary.md
            ${{ runner.temp }}/dt-check/logs
          retention-days: 14
          if-no-files-found: ignore

  # Needs nothing from plan, so it starts with it.
  host-tests:
    name: host tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        group: [tools, aurora-sep, aurora-sep-slow]
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install what the suites need
        run: python3 -I tools/aurora-ci/host-tests.py --group "$GROUP" --install
      - name: Run the ${{ matrix.group }} suites
        run: |
          python3 -I tools/aurora-ci/host-tests.py --group "$GROUP" --fetch-commits --jobs 4 \
            --output "$RUNNER_TEMP/host-tests"
      - name: Keep the suites' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-tests-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tests
          retention-days: 14
          if-no-files-found: ignore

  self-test:
    name: CI self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # The whole tree: the manifest tests check host-tests.json against it.
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -m unittest discover --start-directory tools/aurora-ci/tests --verbose
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          inputs: .github/workflows
          persona: pedantic
          advanced-security: false
          annotations: true

  package:
    name: package
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    # A reused build only downloads and checks the packages; that needs no
    # build machine.
    runs-on: ${{ needs.plan.outputs.package_run != '' && 'ubuntu-24.04' || fromJSON(vars.KERNEL_CI_RUNNER || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 180
    permissions:
      actions: read # look up and download earlier runs' artifacts
      contents: read # check out the repository
    env:
      KEY: ${{ needs.plan.outputs.key }}
      REUSE_RUN: ${{ needs.plan.outputs.package_run }}
    steps:
      - name: Check out the kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linux
          persist-credentials: false
      - name: Check out omarchy-pkgs at the commit the build key names
        if: env.REUSE_RUN == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RECIPE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.recipe_commit }}
          path: omarchy-pkgs
          persist-credentials: false
      - name: Point the linux-aurora recipe at this commit
        if: env.REUSE_RUN == ''
        run: |
          mkdir -p out/packages
          python3 -I linux/tools/aurora-ci/prepare-recipe.py \
            --recipe omarchy-pkgs/pkgbuilds/linux-aurora --kernel linux \
            --commit "$(git -C linux rev-parse HEAD)" --revision "$GITHUB_RUN_NUMBER" \
            --record out/recipe.json
      - name: Build with omarchy-pkgs bin/build
        if: env.REUSE_RUN == ''
        working-directory: omarchy-pkgs
        env:
          CONTAINER_ENGINE: docker
        run: bin/build --mirror edge --arch aarch64 --package linux-aurora
      - name: Collect the packages
        if: env.REUSE_RUN == ''
        run: |
          cp omarchy-pkgs/build-output/edge/aarch64/linux-aurora-*.pkg.tar.zst out/packages/
          ls -l out/packages
      - name: Download the packages built for this key
        if: env.REUSE_RUN != '' && needs.plan.outputs.package_artifact == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-package-${{ env.KEY }}
          path: out
          run-id: ${{ env.REUSE_RUN }}
          github-token: ${{ github.token }}
      # The very artifact plan paired with the verification; fails if a
      # re-run of that pull request run has replaced it since.
      - name: Download the pull request run's packages
        if: needs.plan.outputs.package_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.package_artifact }}
          path: out
          run-id: ${{ env.REUSE_RUN }}
          github-token: ${{ github.token }}
      # Not every runner image ships kmod (Namespace's does not).
      - name: Install depmod
        run: |
          if ! command -v depmod >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends kmod
          fi
      - name: Inspect the packages
        run: |
          python3 -I linux/tools/aurora-ci/inspect-package.py --packages out/packages \
            --output out/metadata.json
      - name: Download the target branch's package metadata
        if: needs.plan.outputs.baseline_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-metadata-${{ needs.plan.outputs.base_tree }}
          path: baseline
          run-id: ${{ needs.plan.outputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Compare with the target branch
        if: needs.plan.outputs.baseline_run != ''
        run: |
          python3 -I linux/tools/aurora-ci/compare-packages.py --base baseline/metadata.json \
            --head out/metadata.json --retired linux/tools/aurora-ci/retired-dtbs.txt \
            --report out/compare.json
      - name: Note a missing baseline
        if: needs.plan.outputs.baseline_run == ''
        run: |
          echo "::notice title=No baseline::The target branch has no package metadata yet; its next push build records it."
      - name: Upload the packages
        if: env.REUSE_RUN == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-package-${{ env.KEY }}
          path: out/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Upload the metadata for later comparisons
        if: env.REUSE_RUN == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-metadata-${{ needs.plan.outputs.kernel_tree }}
          path: out/metadata.json
          retention-days: 90
          if-no-files-found: error

  kunit:
    name: KUnit
    needs: plan
    if: needs.plan.outputs.tier == 'full' && needs.plan.outputs.verified_run == ''
    runs-on: ${{ fromJSON(vars.KERNEL_CI_RUNNER || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 90
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the KUnit toolchain
        run: python3 -I tools/aurora-ci/run-kunit.py --install-toolchain
      - name: Build and run the Apple KUnit suites
        run: python3 -I tools/aurora-ci/run-kunit.py --output "$RUNNER_TEMP/kunit"
      - name: Keep the results and console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kunit-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kunit/kunit-results.json
            ${{ runner.temp }}/kunit/kunit-results.xml
            ${{ runner.temp }}/kunit/test.log
            ${{ runner.temp }}/kunit/.config
          retention-days: 14
          if-no-files-found: ignore

  boot:
    name: boot
    needs: [plan, package]
    if: needs.plan.outputs.tier == 'full' && needs.plan.outputs.verified_run == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      actions: read # look up and download earlier runs' artifacts
      contents: read # check out the repository
    steps:
      - name: Check out the CI tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: tools/aurora-ci
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-package-${{ needs.plan.outputs.key }}
          path: out
          run-id: ${{ needs.plan.outputs.package_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU and busybox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm busybox-static
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kernel-ci-kvm.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Unpack the kernel package
        run: |
          mkdir root
          tar --zstd -xf out/packages/linux-aurora-[0-9]*.pkg.tar.zst -C root
      - name: Boot it and load every module
        run: |
          python3 -I tools/aurora-ci/boot-test.py --root root --busybox /bin/busybox \
            --expected tools/aurora-ci/boot-expected.json --out "$RUNNER_TEMP/boot"
      - name: Keep the console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boot
          retention-days: 14
          if-no-files-found: ignore

  result:
    name: result
    needs: [plan, commits, compile, devicetree, host-tests, self-test, package, kunit, boot]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out the CI tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: tools/aurora-ci
      - name: Decide the result
        id: result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -I tools/aurora-ci/result.py
      - name: Record that this build key passed
        if: steps.result.outputs.ok == 'true' && needs.plan.outputs.tier == 'full' && needs.plan.outputs.verified_run == ''
        env:
          KEY: ${{ needs.plan.outputs.key }}
          KERNEL_TREE: ${{ needs.plan.outputs.kernel_tree }}
          RECIPE_COMMIT: ${{ needs.plan.outputs.recipe_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          python3 -I -c 'import json, os, sys; json.dump({k.lower(): os.environ[k] for k in
            ("KEY", "KERNEL_TREE", "RECIPE_COMMIT", "GITHUB_RUN_ID", "GITHUB_SHA")}, sys.stdout, indent=1)' \
            > "$RUNNER_TEMP/verified/verified.json"
      - name: Upload the verification record
        if: steps.result.outputs.ok == 'true' && needs.plan.outputs.tier == 'full' && needs.plan.outputs.verified_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-verified-${{ needs.plan.outputs.key }}
          path: ${{ runner.temp }}/verified/verified.json
          retention-days: 90
          if-no-files-found: error
