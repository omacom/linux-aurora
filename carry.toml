# carry.toml on omacom/linux-aurora integration/aurora-7.3
# Upstream-pending changes only. Omacom-only patches are commits on this branch, not entries.
# The generator builds carry/aurora-7.3 = this branch's head (minus this file) + these entries, in order.
#
# Entry fields:
#   pr        upstream PR "owner/repo#N"; retired by the sync that brings its merge in
#   ours      instead of pr: a label for our own commit that has no upstream PR yet
#   commit    the reviewed head (full SHA); copied to carry-input/<N>-<sha12> (ours: carry-input/ours-<sha12>)
#   why       what edge loses without it
#   deps      entries that must come first
#   after     apply only after..commit (stacked PR branches that carry copies of their prerequisites)
#   commits   an explicit subset of the PR's commits, in order (overrides after)
#   upstream  ours only: where it is meant to go upstream, and what is blocking that
#   closed_ok a recorded decision to keep carrying a PR that upstream closed (S7)
package = "linux"
series = "7.3"
series_check = "kernel-makefile"

[upstream]
repo = "https://github.com/aurora-silicon/linux.git"
ref = "integration/aurora"
intake = "0abc2f385e54b8bf3226963e7f167eca5b68295f"

[inputs]
repo = "https://github.com/omacom/linux-aurora.git"

[[carry]]
pr = "aurora-silicon/linux#2145"
commit = "4e3334872df8d6e618c7089ab7e87a3c68760508"
